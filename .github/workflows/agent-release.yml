# Agent release lane (docs/sdlc.md, lane "Agents"; ADR 0066). Promotes the template agent's Agent Server image that
# gate PR built, scanned and evaluated on the tagged commit. Nothing is rebuilt: the release is that exact digest.
#
# 1. The tag must point at a commit on which gate PR passed on push to main. The image gate PR pushed for that
#    commit (ghcr.io/<repo>/agent-template:sha-<commit>) and its SBOM are read from that run's artefacts.
# 2. The digest gets the version tag, is signed with the platform key (the signature admission verifies) and its
#    SBOM is attested with the platform key. A keyless signature with this workflow's identity is added for
#    provenance only; admission does not rely on it.
# 3. Job verify runs the admission signature policy itself (scripts/verify_signatures.py) on the released digest.
#
# Connected sites pull the signed image into Harbor; for the enclave it is added to a Zarf package and carried in.
# Signatures travel with the image (cosign copy, or Zarf). On a platform, the same signing is done by Tekton Chains
# with the same platform key (platform/manifests/tekton).
#
# Needs, in environment `agent-release`: secrets PLATFORM_COSIGN_KEY (encrypted cosign private key) and
# PLATFORM_COSIGN_PASSWORD, and variable PLATFORM_COSIGN_PUBLIC_KEY (the public key admission holds in
# Secret kyverno/cosign-public-key).
name: agent-release

on:
  push:
    tags: ["agent-template-v*"]
  workflow_dispatch:  # for re-running a release; the jobs refuse any ref that is not a release tag

permissions:
  contents: read

env:
  COSIGN_VERSION: v3.1.4
  KYVERNO_CLI_VERSION: v1.19.2

jobs:
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'agent-template-v')
    runs-on: ubuntu-latest
    environment: agent-release
    permissions:
      contents: read
      actions: read     # read gate PR's run and artefacts for this commit
      packages: write
      id-token: write   # keyless provenance signature with the workflow's identity
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: tools
        run: scripts/fetch-tool.sh "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" cosign
      - name: the image gate PR tested on this commit
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id="$(gh run list --workflow gate-pr --event push --branch main --commit "$GITHUB_SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::gate PR has not passed on push to main for $GITHUB_SHA; tag a commit that has."
            exit 1
          fi
          gh run download "$run_id" --name agent-image-candidate --dir candidate
          digest="$(cat candidate/agent-image.digest)"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/agent-template"
          case "$digest" in
            "$repo@sha256:"*) ;;
            *) echo "::error::gate PR run $run_id recorded '$digest', not an image of $repo"; exit 1 ;;
          esac
          echo "Promoting $digest from gate PR run $run_id" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "REPO=$repo" >> "$GITHUB_ENV"
      - name: version tag on the same digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$REPO:${GITHUB_REF_NAME#agent-template-v}"
          docker buildx imagetools create --tag "$tag" "$DIGEST"
          # The tag must resolve to the promoted digest: the digest of a manifest is the SHA-256 of its bytes.
          got="sha256:$(docker buildx imagetools inspect --raw "$tag" | sha256sum | cut -d' ' -f1)"
          if [ "$REPO@$got" != "$DIGEST" ]; then
            echo "::error::$tag resolves to $got, not the promoted $DIGEST"; exit 1
          fi
      - name: sign with the platform key, attest the SBOM, and sign keyless for provenance
        env:
          PLATFORM_COSIGN_KEY: ${{ secrets.PLATFORM_COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.PLATFORM_COSIGN_PASSWORD }}
        run: |
          test -n "$PLATFORM_COSIGN_KEY" || { echo "::error::secret PLATFORM_COSIGN_KEY is not set"; exit 1; }
          # No transparency log: the enclave has none, and admission verifies with the public key only.
          ./cosign sign --yes --key env://PLATFORM_COSIGN_KEY --tlog-upload=false --use-signing-config=false "$DIGEST"
          ./cosign attest --yes --key env://PLATFORM_COSIGN_KEY --tlog-upload=false --use-signing-config=false \
            --type cyclonedx --predicate candidate/agent-sbom.cdx.json "$DIGEST"
          ./cosign sign --yes "$DIGEST"
          echo "Published $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  verify:
    # The released digest against the admission policy as committed, with the platform public key.
    needs: release
    runs-on: ubuntu-latest
    environment: agent-release
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          pip install --require-hashes --only-binary=:all: -r .github/requirements/pyyaml.txt
      - name: tools
        run: scripts/fetch-tool.sh "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_CLI_VERSION}/kyverno-cli_${KYVERNO_CLI_VERSION}_linux_x86_64.tar.gz" kyverno
      - name: admission would accept the released image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_KEY: ${{ vars.PLATFORM_COSIGN_PUBLIC_KEY }}
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          test -n "$PUBLIC_KEY" || { echo "::error::variable PLATFORM_COSIGN_PUBLIC_KEY is not set"; exit 1; }
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          mkdir -p out
          printf '%s\n' "$PUBLIC_KEY" > out/platform.pub
          cat > out/release-pod.yaml <<EOF
          apiVersion: v1
          kind: Pod
          metadata: {name: released-agent, namespace: langsmith, annotations: {test.innovox.uk/expect: pass}}
          spec:
            containers: [{name: agent, image: "$DIGEST"}]
          EOF
          scripts/verify_signatures.py --public-key out/platform.pub --glob "ghcr.io/${GITHUB_REPOSITORY,,}/agent-template*" \
            --resources out/release-pod.yaml
