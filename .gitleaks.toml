# gitleaks configuration (gate PR). Extends the default rules.
[extend]
useDefault = true

[allowlist]
description = "OpenBao paths in ExternalSecret remoteRef.key are references to secrets, not secret values"
regexTarget = "line"
regexes = ['''^\s*key: (langsmith|observability|harbor|keycloak|models)/[a-z0-9/_-]+\s*$''']
