# Zarf (Apache-2.0, OpenSSF) package for the enclave. Build on the connected side, carry the signed package in.
kind: ZarfPackageConfig
metadata:
  name: dp-ai-001-c-platform
  version: 0.1.0
  description: Innovox LangSmith Defence platform, open-source layer, for carry-in
    to a disconnected enclave (B2)
components:
- name: gitops-source
  required: true
  description: This repository, mirrored into the enclave git server; Argo CD syncs
    from it
  repos:
  - https://github.com/martinsharkey/langsmith.git@main
- name: platform-charts
  required: true
  description: Helm charts pinned in versions.yaml. Zarf pushes them into the enclave
    registry.
  charts:
  - name: cert-manager
    version: v1.21.3
    url: https://charts.jetstack.io
    namespace: cert-manager
  - name: trust-manager
    version: v0.26.0
    url: https://charts.jetstack.io
    namespace: cert-manager
  - name: kyverno
    version: 3.9.2
    url: https://kyverno.github.io/kyverno
    namespace: kyverno
  - name: base
    version: 1.32.0
    url: https://istio-release.storage.googleapis.com/charts
    namespace: istio-system
  - name: istiod
    version: 1.32.0
    url: https://istio-release.storage.googleapis.com/charts
    namespace: istio-system
  - name: gateway
    version: 1.32.0
    url: https://istio-release.storage.googleapis.com/charts
    namespace: istio-ingress
  - name: openbao
    version: 0.30.7
    url: https://openbao.github.io/openbao-helm
    namespace: openbao
  - name: external-secrets
    version: 2.15.0
    url: https://charts.external-secrets.io
    namespace: external-secrets
  - name: rook-ceph
    version: v1.21.2
    url: https://charts.rook.io/release
    namespace: rook-ceph
  - name: cloudnative-pg
    version: 0.29.1
    url: https://cloudnative-pg.github.io/charts
    namespace: cnpg-system
  - name: harbor
    version: 1.19.4
    url: https://helm.goharbor.io
    namespace: harbor
  - name: opensearch
    version: 3.9.0
    url: https://opensearch-project.github.io/helm-charts
    namespace: observability
  - name: opensearch-dashboards
    version: 3.9.0
    url: https://opensearch-project.github.io/helm-charts
    namespace: observability
  - name: kube-prometheus-stack
    version: 93.2.2
    url: https://prometheus-community.github.io/helm-charts
    namespace: observability
  - name: falco
    version: 9.2.2
    url: https://falcosecurity.github.io/charts
    namespace: falco
  - name: fluent-bit
    version: 0.58.3
    url: https://fluent.github.io/helm-charts
    namespace: observability
  - name: argo-cd
    version: 10.18.0
    url: https://argoproj.github.io/argo-helm
    namespace: argocd
  - name: keda
    version: 2.21.0
    url: https://kedacore.github.io/charts
    namespace: keda
  images:
  - docker.io/valkey/valkey:9.1.3
  - ghcr.io/cloudnative-pg/postgresql:18
  - docker.io/amazon/aws-cli:2.40.1
  - quay.io/ceph/ceph:v20.2.5
  actions:
    onCreate:
      before:
      - cmd: 'echo ''Chart images: run make zarf-images to append the images each
          chart references (zarf dev find-images).'''
- name: models
  required: true
  description: Model service image. Weights are carried separately after the intake
    gate (model-intake).
  images:
  - docker.io/vllm/vllm-openai:v0.33.0
