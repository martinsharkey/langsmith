# Security risk register (MOD Secure by Design). First pass, before deployment. Scores are 1 (low) to 5 (high);
# rating = likelihood x impact. `threats` refer to docs/assurance/threat-model.md, `controls` to docs/controls.yaml,
# `issue` to the GitHub issue where the treatment is completed. The risk owner for a client installation is the
# client's Senior Responsible Owner; until then the owner is Innovox.
risks:
  - id: SR-01
    risk: An unapproved, tampered or unsafe model serves answers
    threats: [T-06, T-07]
    likelihood: 2
    impact: 5
    treatment: Model intake gate; admission refuses model pods without a decision record
    controls: [CTL-04, CTL-05]
    status: partly-proven
    issue: 18
  - id: SR-02
    risk: Client data leaves the approved boundary through a model call or other egress
    threats: [T-08]
    likelihood: 2
    impact: 5
    treatment: In B1, internet egress only for the gateway, licence holders and Argo CD, to named hosts (ADR 0045); zero egress in B2; proven by flow logs
    controls: [CTL-08]
    status: built-unproven
    issue: 16
  - id: SR-03
    risk: Prompt injection makes an agent act against the user's interest
    threats: [T-09, T-12]
    likelihood: 4
    impact: 4
    treatment: Approval before outside effects; tool allowlist; no credentials in agents; red teaming
    controls: [CTL-06, CTL-07, CTL-14]
    status: partly-proven
    issue: 22
  - id: SR-04
    risk: One user or tenant reads another's work
    threats: [T-03, T-04]
    likelihood: 2
    impact: 4
    treatment: Custom auth, owner-scoped threads, per-user memory, one installation per client
    controls: [CTL-07, CTL-09]
    status: partly-proven
    issue: 14
  - id: SR-05
    risk: Tools reach client systems with more authority than the user has
    threats: [T-10, T-11, T-15]
    likelihood: 3
    impact: 4
    treatment: MCP allowlist (built); per-user tool credentials with Agent Auth (not built)
    controls: [CTL-07]
    status: open
    issue: 14
  - id: SR-06
    risk: Compromised software reaches the cluster through an image, chart, package or carry-in
    threats: [T-18, T-19, T-20]
    likelihood: 3
    impact: 5
    treatment: Signature verification, registry allowlist, SBOM and scan, signed Zarf packages
    controls: [CTL-01, CTL-02, CTL-03]
    status: partly-proven
    issue: 15
  - id: SR-07
    risk: Administrative access is misused or taken over
    threats: [T-16, T-17]
    likelihood: 2
    impact: 5
    treatment: MFA, jump host, Git-only change, audit; separation of duties in the operating organisation
    controls: [CTL-12, CTL-13]
    status: built-unproven
    issue: 8
  - id: SR-08
    risk: Sensitive content is retained in traces or memory longer or more widely than allowed
    threats: [T-13, T-25]
    likelihood: 3
    impact: 3
    treatment: Trace redaction, retention and workspace roles in LangSmith; per-user memory
    controls: [CTL-09, CTL-15]
    status: open
    issue: 9
  - id: SR-09
    risk: Evidence needed for assurance is missing or can be altered
    threats: [T-23]
    likelihood: 2
    impact: 4
    treatment: Object Lock evidence bucket; logs shipped off workload nodes; evidence produced by the pipeline
    controls: [CTL-13, CTL-02]
    status: built-unproven
    issue: 20
  - id: SR-10
    risk: A runaway agent or failed dependency takes the service down
    threats: [T-14]
    likelihood: 3
    impact: 3
    treatment: Limits at the gateway and in the runtime; backup, restore and upgrade rehearsal
    controls: [CTL-16]
    status: built-unproven
    issue: 21
  - id: SR-11
    risk: A vendor component cannot run as designed (SmithDB only, Valkey, offline licence, FIPS)
    threats: []
    likelihood: 3
    impact: 4
    treatment: Prove each on the first licensed installation; documented fallbacks (ClickHouse, Redis 8)
    controls: []
    status: open
    issue: 9
  - id: SR-12
    risk: Vulnerabilities remain that design review and automated tests do not find
    threats: []
    likelihood: 4
    impact: 4
    treatment: Independent CHECK penetration test and AI red teaming before gate P1
    controls: [CTL-17]
    status: open
    issue: 22
