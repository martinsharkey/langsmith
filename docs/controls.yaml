    mechanism: native
    implemented_by: [policies/kyverno/policies/verify-innovox-signatures.yaml, policies/kyverno/policies/restrict-image-sources.yaml, policies/kyverno/policies/disallow-latest-tag.yaml]
    gate: admission
    evidence: Kyverno policy reports
