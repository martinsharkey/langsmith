# Kubernetes API audit policy (CTL-13). Logs metadata for everything, request bodies for changes to
# security-relevant objects, and never logs secret contents.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "rbac.authorization.k8s.io"
      - group: "admissionregistration.k8s.io"
      - group: "kyverno.io"
      - group: "policies.kyverno.io"        # ValidatingPolicy, ImageValidatingPolicy (policies/kyverno)
      - group: "cilium.io"
      - group: "security.istio.io"
      - group: "networking.istio.io"        # ServiceEntry: the approved egress list (policies/egress)
      - group: "networking.k8s.io"
      - group: "cert-manager.io"            # issuers decide which certificates the platform trusts
        resources: ["issuers", "clusterissuers"]
      - group: "external-secrets.io"        # secret stores decide where secrets come from; no secret values
        resources: ["secretstores", "clustersecretstores"]
      - group: "argoproj.io"                # projects bound what Argo CD may deploy; Applications stay at
        resources: ["appprojects"]          # Metadata, as the controller writes their status continuously
  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]
  - level: None
    nonResourceURLs: ["/healthz*", "/readyz*", "/livez*", "/version"]
  - level: Metadata
