# Copied to /var/lib/rancher/rke2/server/manifests/ on the first server. Configures RKE2's bundled Cilium.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-cilium
  namespace: kube-system
spec:
  valuesContent: |-
    kubeProxyReplacement: true
    k8sServiceHost: "localhost"
    k8sServicePort: "6443"
    policyEnforcementMode: "default"
    hubble:
      enabled: true
      relay:
        enabled: true
      metrics:
        enabled: ["dns", "drop", "flow", "policy"]
    encryption:
      enabled: false   # pod-to-pod encryption is provided by Istio mutual TLS (CTL-10)
