[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-intake"
version = "0.1.0"
description = "Innovox model intake gate: provenance, ML-BOM, evaluation thresholds and decision records (AD-46)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []          # standard library only, so it runs unchanged inside the enclave

[project.scripts]
model-intake = "model_intake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
