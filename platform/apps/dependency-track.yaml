---
# Dependency-Track (Apache-2.0, OWASP): holds every SBOM and ML-BOM the pipelines produce and reports known
# vulnerabilities and licence breaches against them (CTL-02, CTL-03).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dependency-track
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '6'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
  - repoURL: https://dependencytrack.github.io/helm-charts
    chart: dependency-track
    targetRevision: 2.10.0
    helm:
      releaseName: dependency-track
      valueFiles:
      - $values/platform/values/dependency-track/values.yaml
  - repoURL: https://github.com/martinsharkey/langsmith.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: supply-chain
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
