---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
  - repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.2
    helm:
      releaseName: kyverno
      valueFiles:
      - $values/platform/values/kyverno/values.yaml
  - repoURL: https://github.com/martinsharkey/langsmith.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
