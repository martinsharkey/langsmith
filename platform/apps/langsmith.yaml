---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langsmith
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '6'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
  - repoURL: https://langchain-ai.github.io/helm
    chart: langsmith
    targetRevision: 0.17.51
    helm:
      releaseName: langsmith
      valueFiles:
      - $values/platform/values/langsmith/values.yaml
  - repoURL: https://github.com/martinsharkey/langsmith.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: langsmith
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
