---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
  - repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.30.7
    helm:
      releaseName: openbao
      valueFiles:
      - $values/platform/values/openbao/values.yaml
  - repoURL: https://github.com/martinsharkey/langsmith.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
