---
# OpenTelemetry Collector (Apache-2.0): receives the OTLP traces LangSmith's own services emit and stores them in
# OpenSearch. LangChain's collector guidance: OTLP receiver; memory limiter, batch and Kubernetes attributes processors.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
  - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.180.0
    helm:
      releaseName: otel-collector
      valueFiles:
      - $values/platform/values/otel-collector/values.yaml
  - repoURL: https://github.com/martinsharkey/langsmith.git
    targetRevision: main
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
