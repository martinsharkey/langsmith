---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-supply-chain
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '5'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://git.invalid/platform.git
    targetRevision: platform-release
    path: platform/manifests/supply-chain
  destination:
    server: https://kubernetes.default.svc
    namespace: langsmith
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
