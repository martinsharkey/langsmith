---
# Bootstrap for mode B1 (connected, OFFICIAL-SENSITIVE): kubectl apply -k platform/argocd/b1
# (the release component sets the repository and release tag; do not apply this file on its own)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://git.invalid/platform.git    # set by platform/overlays/release
    targetRevision: platform-release
    path: platform/overlays/b1
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
