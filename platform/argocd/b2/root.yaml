---
# Bootstrap for mode B2 (disconnected enclave): kubectl apply -k platform/argocd/b2
# The release component sets the repository and release tag; Zarf then rewrites the git URL to the enclave git server.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://git.invalid/platform.git    # set by platform/overlays/release
    targetRevision: platform-release
    path: platform/overlays/b2
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
