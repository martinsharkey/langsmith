---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Innovox LangSmith Defence platform (DP-AI-001-C)
  sourceRepos:
    - https://github.com/martinsharkey/langsmith.git
    - https://github.com/keycloak/keycloak-k8s-resources.git
    - https://github.com/rancher/local-path-provisioner.git
    - https://charts.jetstack.io
    - https://kyverno.github.io/kyverno
    - https://istio-release.storage.googleapis.com/charts
    - https://openbao.github.io/openbao-helm
    - https://charts.external-secrets.io
    - https://charts.rook.io/release
    - https://cloudnative-pg.github.io/charts
    - https://helm.goharbor.io
    - https://opensearch-project.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://falcosecurity.github.io/charts
    - https://fluent.github.io/helm-charts
    - https://langchain-ai.github.io/helm
    - https://kedacore.github.io/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
