---
# Bootstrap for mode B1 (connected, OFFICIAL-SENSITIVE): kubectl apply -f platform/argocd/project.yaml -f platform/argocd/root-b1.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/martinsharkey/langsmith.git
    targetRevision: main
    path: platform/overlays/b1
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
