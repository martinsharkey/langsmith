# Platform certificate authority (cert-manager). The root key never leaves the cluster's secret store; sites with
# their own PKI replace platform-ca-issuer with an issuer for the site CA.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Innovox platform root CA
  secretName: platform-root-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 384
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-ca-issuer
spec:
  ca:
    secretName: platform-root-ca
---
# Distributes the platform root CA to every namespace as Secret platform-ca-bundle (key ca-bundle.crt),
# used by LangSmith (config.customCa) and any client that must verify platform certificates.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: platform-ca-bundle
spec:
  sources:
    - secret:
        name: platform-root-ca
        key: ca.crt
  target:
    secret:
      key: ca-bundle.crt
