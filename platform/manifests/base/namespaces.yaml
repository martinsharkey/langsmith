# Pod Security levels per namespace. Privileged only where the component needs host access (storage, CNI,
# runtime detection, log collection). Mesh injection on every namespace that carries user or model traffic.
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    innovox.uk/platform: dp-ai-001-c
---
