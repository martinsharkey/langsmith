# Mutual TLS everywhere in the mesh (CTL-10), and the platform ingress gateway.
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-ingress
  namespace: istio-ingress
spec:
  secretName: platform-ingress-tls
  dnsNames:
    - langsmith.site.example
    - harbor.site.example
    - keycloak.site.example
  issuerRef:
    name: platform-ca-issuer
    kind: ClusterIssuer
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: istio-ingress
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: platform-ingress-tls
        minProtocolVersion: TLSV1_2
      hosts:
        - langsmith.site.example
        - harbor.site.example
        - keycloak.site.example
    # Argo CD serves its own certificate (argocd-server-tls below): the argocd namespace is not in the mesh, so
    # the gateway passes the TLS connection through by SNI instead of terminating it.
    - port:
        number: 443
        name: https-argocd
        protocol: HTTPS   # as in the Istio SNI passthrough task
      tls:
        mode: PASSTHROUGH
      hosts:
        - argocd.site.example
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: harbor
  namespace: harbor
spec:
  hosts: ["harbor.site.example"]
  gateways: ["istio-ingress/platform-gateway"]
  http:
    - route:
        - destination:
            host: harbor.harbor.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: keycloak
  namespace: keycloak
spec:
  hosts: ["keycloak.site.example"]
  gateways: ["istio-ingress/platform-gateway"]
  http:
    - route:
        - destination:
            host: keycloak-service.keycloak.svc.cluster.local
            port:
              number: 8080   # Keycloak's HTTP port; the hop from the gateway is Istio mutual TLS
---
# Argo CD's own serving certificate. argocd-server reads Secret argocd-server-tls and reloads it when it changes
# (Argo CD operator manual, TLS configuration).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server-tls
  namespace: argocd
spec:
  secretName: argocd-server-tls
  dnsNames:
    - argocd.site.example
  issuerRef:
    name: platform-ca-issuer
    kind: ClusterIssuer
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: argocd
  namespace: argocd
spec:
  hosts: ["argocd.site.example"]
  gateways: ["istio-ingress/platform-gateway"]
  tls:
    - match:
        - port: 443
          sniHosts: ["argocd.site.example"]
      route:
        - destination:
            host: argocd-server.argocd.svc.cluster.local
            port:
              number: 443
