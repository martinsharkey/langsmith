# Keycloak (operator 26.8.2) with its own PostgreSQL 18 cluster. Identity for LangSmith (OIDC with PKCE) and for
# Agent Server custom auth (CTL-07). MFA is required for every user (CTL-12).
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-pg
  namespace: keycloak
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    storageClass: ceph-block
    size: 20Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret:
        name: keycloak-db-credentials
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
spec:
  secretName: keycloak-tls
  dnsNames:
    - keycloak.site.example
    - keycloak-service.keycloak.svc
  issuerRef:
    name: platform-ca-issuer
    kind: ClusterIssuer
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 2
  db:
    vendor: postgres
    host: keycloak-pg-rw.keycloak.svc
    database: keycloak
    usernameSecret:
      name: keycloak-db-credentials
      key: username
    passwordSecret:
      name: keycloak-db-credentials
      key: password
  http:
    tlsSecret: keycloak-tls
  hostname:
    hostname: keycloak.site.example
  proxy:
    headers: xforwarded
