# The `langsmith` realm. LangSmith SSO uses OIDC with a client secret (authType mixed); PKCE is deprecated by
# LangChain from v16 and is not enforced here (AD-58). The client secret is injected from a Secret, never written here.
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: langsmith-realm
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    WORKBENCH_CLIENT_SECRET:
      secret:
        name: keycloak-workbench-client
        key: client_secret
    LANGSMITH_CLIENT_SECRET:
      secret:
        name: keycloak-langsmith-client
        key: client_secret
  realm:
    realm: langsmith
    enabled: true
    sslRequired: all
    registrationAllowed: false
    bruteForceProtected: true
    failureFactor: 5
    passwordPolicy: "length(14) and notUsername and passwordHistory(5)"
    otpPolicyType: totp
    otpPolicyAlgorithm: HmacSHA256
    requiredActions:
      - alias: CONFIGURE_TOTP
        name: Configure OTP
        providerId: CONFIGURE_TOTP
        enabled: true
        defaultAction: true
    accessTokenLifespan: 300
    ssoSessionMaxLifespan: 36000
    # Agent Server's custom auth reads realm roles from `realm_access.roles` (AD-57).
    roles:
      realm:
        - name: agent-user
          description: May use agents through the workbench.
        - name: agent-admin
          description: May create and change Agent Server assistants.
    # Argo CD maps these groups to its RBAC roles (issue #59).
    groups:
      - name: platform-admins
      - name: platform-readonly
    # Keycloak creates its built-in client scopes (basic, roles, profile, ...) on import only when the realm lists
    # no client scopes, unless this attribute is set (RealmManager.isCreateDefaultClientScopes, Keycloak 26.8.2).
    attributes:
      CreateDefaultClientScopes: "true"
    clientScopes:
      - name: groups
        description: Group membership, as the `groups` claim (short group names).
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
    # Each client lists its default client scopes in full, so the access token carries what Agent Server needs:
    # `basic` adds `sub` (Keycloak 25 and later), `roles` adds `realm_access`, `acr` and `web-origins` are
    # Keycloak's other realm defaults. `openid` is not a client scope; it is the meta-value of the scope parameter.
    clients:
      - clientId: langsmith
        name: LangSmith
        protocol: openid-connect
        publicClient: false
        secret: "${LANGSMITH_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://langsmith.site.example/*
        webOrigins:
          - https://langsmith.site.example
        defaultClientScopes: ["basic", "acr", "web-origins", "roles", "profile", "email"]
      - clientId: workbench
        name: Workbench
        protocol: openid-connect
        publicClient: false
        secret: "${WORKBENCH_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://workbench.site.example/api/auth/callback
        webOrigins:
          - https://workbench.site.example
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://workbench.site.example
        defaultClientScopes: ["basic", "acr", "web-origins", "roles", "profile", "email"]
        protocolMappers:
          # Agent Server's custom auth requires the `workbench` audience in the access token (AD-57).
          - name: workbench-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: workbench
              id.token.claim: "false"
              access.token.claim: "true"
      # Argo CD single sign-on (issue #59): a public client with PKCE, used by the web UI and the `argocd` CLI.
      - clientId: argocd
        name: Argo CD
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://argocd.site.example/auth/callback
          - https://argocd.site.example/pkce/verify
          - http://localhost:8085/auth/callback
        webOrigins:
          - https://argocd.site.example
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://argocd.site.example
        defaultClientScopes: ["basic", "acr", "web-origins", "roles", "profile", "email", "groups"]
