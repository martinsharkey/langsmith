# The `langsmith` realm. LangSmith SSO uses OIDC with a client secret (authType mixed); PKCE is deprecated by
# LangChain from v16 and is not enforced here (AD-58). The client secret is injected from a Secret, never written here.
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: langsmith-realm
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    WORKBENCH_CLIENT_SECRET:
      secret:
        name: keycloak-workbench-client
        key: client_secret
    LANGSMITH_CLIENT_SECRET:
      secret:
        name: keycloak-langsmith-client
        key: client_secret
  realm:
    realm: langsmith
    enabled: true
    sslRequired: all
    registrationAllowed: false
    bruteForceProtected: true
    failureFactor: 5
    passwordPolicy: "length(14) and notUsername and passwordHistory(5)"
    otpPolicyType: totp
    otpPolicyAlgorithm: HmacSHA256
    requiredActions:
      - alias: CONFIGURE_TOTP
        name: Configure OTP
        providerId: CONFIGURE_TOTP
        enabled: true
        defaultAction: true
    accessTokenLifespan: 300
    ssoSessionMaxLifespan: 36000
    clients:
      - clientId: langsmith
        name: LangSmith
        protocol: openid-connect
        publicClient: false
        secret: "${LANGSMITH_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://langsmith.site.example/*
        webOrigins:
          - https://langsmith.site.example
        defaultClientScopes: ["openid", "profile", "email"]
      - clientId: workbench
        name: Workbench
        protocol: openid-connect
        publicClient: false
        secret: "${WORKBENCH_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://workbench.site.example/api/auth/callback
        webOrigins:
          - https://workbench.site.example
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://workbench.site.example
        defaultClientScopes: ["openid", "profile", "email"]
        protocolMappers:
          # Agent Server's custom auth requires the `workbench` audience in the access token (AD-57).
          - name: workbench-audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: workbench
              id.token.claim: "false"
              access.token.claim: "true"
