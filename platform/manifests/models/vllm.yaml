# Sovereign model service (AD-24): the upstream vLLM image as shipped, serving weights that passed the intake gate
# (model-intake). The weights are a signed OCI artefact in the site Harbor, mounted read-only as an image volume
# (owner ruling on issue 49, 2026-11-21). Image volumes are stable from Kubernetes 1.36; RKE2 v1.37.2 ships
# containerd 2.3.7, which supports them from 2.1. The container has no egress.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-class-m
  namespace: models
  labels:
    app: vllm
    innovox.uk/model-class: m
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      innovox.uk/model-class: m
  template:
    metadata:
      annotations:
        # Set to the decision ID that model-intake issued for the weights mounted at /models/approved/class-m.
        # Kyverno refuses the pod until a valid ID is present (require-model-intake-record, AD-46).
        innovox.uk/intake-record: SET-AT-INTAKE
      labels:
        app: vllm
        innovox.uk/model-class: m
        innovox.uk/model-role: chat
    spec:
      nodeSelector:
        innovox.uk/pool: gpu
      tolerations:
        - key: innovox.uk/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.33.0
          args:
            - --model=/models/approved/class-m
            - --served-model-name=class-m
            - --host=0.0.0.0
            - --port=8000
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-api-key
                  key: api_key
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            - name: HOME
              value: /tmp
          ports:
            - containerPort: 8000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: weights
              mountPath: /models/approved/class-m
              readOnly: true
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
      volumes:
        # The approved artefact, by digest: set it to the digest model-intake recorded under the decision ID above.
        # An image volume is always read-only and is pulled like a container image (node registry configuration,
        # pull credentials). The artefact's layout under the mount path is proven at E1 (issue 49).
        - name: weights
          image:
            reference: harbor.site.example/innovox/models/class-m@sha256:SET-AT-INTAKE
            pullPolicy: IfNotPresent
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-class-m
  namespace: models
spec:
  selector:
    app: vllm
    innovox.uk/model-class: m
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Chat models: only the LLM Gateway may call them (AD-59). Istio allows a request when one of the ALLOW policies that
# select the workload matches, and refuses it otherwise, so every other LangSmith workload, Agent Server among them,
# gets HTTP 403. The principal is the gateway's service account as chart 0.17.51 renders it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: vllm-chat-callers
  namespace: models
spec:
  selector:
    matchLabels:
      app: vllm
      innovox.uk/model-role: chat
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/langsmith/sa/langsmith-agent-gateway"]
      to:
        - operation:
            paths: ["/v1/chat/completions", "/v1/completions", "/v1/models", "/health"]
---
# Embedding models: the one documented direct path (AD-59: the gateway serves chat formats only), for Agent Server
# store embeddings. Agent Server pods run as the langsmith namespace's default service account, because the
# operator's deployment template in chart 0.17.51 sets no serviceAccountName. Embeddings only, and only on workloads
# labelled as embedding models; none is deployed yet.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: vllm-embedding-callers
  namespace: models
spec:
  selector:
    matchLabels:
      app: vllm
      innovox.uk/model-role: embedding
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/langsmith/sa/default"]
      to:
        - operation:
            paths: ["/v1/embeddings", "/v1/models", "/health"]
