# Monitors for charts that sync before kube-prometheus-stack provides the monitor CRDs (wave 7), so cannot ship
# their own. Same selectors and endpoints the cert-manager and CloudNativePG charts render. The `release` label is
# what the stack's Prometheus selects monitors by (serviceMonitorSelectorNilUsesHelmValues, chart default true).
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames: [cert-manager]
  selector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [cainjector, cert-manager, webhook]}
      - {key: app.kubernetes.io/instance, operator: In, values: [cert-manager]}
      - {key: app.kubernetes.io/component, operator: In, values: [cainjector, controller, webhook]}
  endpoints:
    - targetPort: http-metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudnative-pg
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: [cnpg-system]
  selector:
    matchLabels:
      app.kubernetes.io/instance: cloudnative-pg
      app.kubernetes.io/name: cloudnative-pg
  podMetricsEndpoints:
    - port: metrics
