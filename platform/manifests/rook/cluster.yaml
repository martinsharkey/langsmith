# Ceph cluster on the storage-tier nodes' raw disks. Encryption at rest on every OSD (CTL-11).
---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.5
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
  dashboard:
    enabled: true
    ssl: true
  network:
    connections:
      encryption:
        enabled: true          # msgr2 on-wire encryption
      requireMsgr2: true
  storage:
    useAllNodes: false
    useAllDevices: false
    config:
      encryptedDevice: "true"
    nodes: []                  # set per site in an overlay: node names and device filters
  placement:
    all:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: innovox.uk/pool
                  operator: In
                  values: ["storage"]
---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: replicapool
  namespace: rook-ceph
spec:
  failureDomain: host
  replicated:
    size: 3
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ceph-block
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: replicapool
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
allowVolumeExpansion: true
reclaimPolicy: Retain
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: platform
  namespace: rook-ceph
spec:
  metadataPool:
    failureDomain: host
    replicated:
      size: 3
  dataPool:
    failureDomain: host
    replicated:
      size: 3
  preservePoolsOnDelete: true
  # TLS only (issue 39): no plain port, so RGW listens on securePort alone. RGW has no mesh sidecar (rook-ceph is
  # not injected), so it must terminate TLS itself. Rook accepts a kubernetes.io/tls Secret and then passes both
  # the certificate and the key to the beast frontend.
  gateway:
    securePort: 443
    sslCertificateRef: rgw-platform-tls
    instances: 2
---
# Server certificate for the object gateway, from the platform CA. Clients trust it through platform-ca-bundle,
# which trust-manager writes to every namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rgw-platform
  namespace: rook-ceph
spec:
  secretName: rgw-platform-tls
  usages: ["server auth"]
  dnsNames:
    - rook-ceph-rgw-platform
    - rook-ceph-rgw-platform.rook-ceph.svc
    - rook-ceph-rgw-platform.rook-ceph.svc.cluster.local
  issuerRef:
    name: platform-ca-issuer
    kind: ClusterIssuer
---
# Snapshots for CloudNativePG volume-snapshot backups (RKE2 ships the snapshot controller).
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: ceph-block-snapshots
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: rook-ceph.rbd.csi.ceph.com
deletionPolicy: Retain
parameters:
  clusterID: rook-ceph
  csi.storage.k8s.io/snapshotter-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/snapshotter-secret-namespace: rook-ceph
