# External Secrets reads from OpenBao (Vault-compatible API) with Kubernetes service-account authentication.
# OpenBao policy and role setup: docs/runbooks/install-b1.md, step "Initialise OpenBao".
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: platform
      version: v2
      caProvider:
        type: Secret
        name: platform-ca-bundle
        namespace: external-secrets
        key: ca-bundle.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
