# Every Kubernetes Secret the platform uses, created from OpenBao paths under the `platform` KV v2 mount.
# The values are written into OpenBao at install time (runbook); none are in this repository.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langsmith-config
  namespace: langsmith
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: langsmith-config
    creationPolicy: Owner
  data:
  - secretKey: langsmith_license_key
    remoteRef:
      key: langsmith/config
      property: langsmith_license_key
  - secretKey: api_key_salt
    remoteRef:
      key: langsmith/config
      property: api_key_salt
  - secretKey: jwt_secret
    remoteRef:
      key: langsmith/config
      property: jwt_secret
  - secretKey: oauth_client_secret
    remoteRef:
      key: langsmith/config
      property: oauth_client_secret
  - secretKey: insights_encryption_key
    remoteRef:
      key: langsmith/config
      property: insights_encryption_key
  - secretKey: polly_encryption_key
    remoteRef:
      key: langsmith/config
      property: polly_encryption_key
  - secretKey: blob_storage_access_key
    remoteRef:
      key: langsmith/s3
      property: access_key
  - secretKey: blob_storage_access_key_secret
    remoteRef:
      key: langsmith/s3
      property: secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-langsmith-credentials
  namespace: langsmith
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pg-langsmith-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: langsmith
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: langsmith/postgres
      property: langsmith_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-smithdb-credentials
  namespace: langsmith
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: pg-smithdb-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: smithdb
        password: '{{ .password }}'
  data:
  - secretKey: password
    remoteRef:
      key: langsmith/postgres
      property: smithdb_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langsmith-postgres
  namespace: langsmith
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: langsmith-postgres
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        connection_url: langsmith:{{ .password }}@langsmith-pg-rw.langsmith.svc:5432/langsmith?sslmode=verify-full
  data:
  - secretKey: password
    remoteRef:
      key: langsmith/postgres
      property: langsmith_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smithdb-config
  namespace: langsmith
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: smithdb-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        host: langsmith-pg-rw.langsmith.svc
        dbname: smithdb
        user: smithdb
        password: '{{ .password }}'
        AWS_ACCESS_KEY_ID: '{{ .AWS_ACCESS_KEY_ID }}'
        AWS_SECRET_ACCESS_KEY: '{{ .AWS_SECRET_ACCESS_KEY }}'
  data:
  - secretKey: password
    remoteRef:
      key: langsmith/postgres
      property: smithdb_password
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: langsmith/s3
      property: access_key
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: langsmith/s3
      property: secret_key
---
apiVersion: external-secrets.io/v1
