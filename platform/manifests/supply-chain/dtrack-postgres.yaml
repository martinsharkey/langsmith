# PostgreSQL for Dependency-Track, kept apart from LangSmith's cluster so neither affects the other's upgrades.
# CloudNativePG creates database `dtrack`, role `dtrack` and Secret `dtrack-pg-app` (username, password).
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dtrack-pg
  namespace: supply-chain
spec:
  instances: 2
  # Same pin as platform/manifests/data/postgres.yaml and versions.yaml (issue 58).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-202611201711-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6
  storage:
    storageClass: ceph-block
    size: 20Gi
  bootstrap:
    initdb:
      database: dtrack
      owner: dtrack
  monitoring:
    enablePodMonitor: true
  affinity:
    enablePodAntiAffinity: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dependency-track-kek
  namespace: supply-chain
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: dependency-track-kek
    creationPolicy: Owner
  data:
  - secretKey: kek
    remoteRef:
      key: dependency-track/kek
      property: kek
