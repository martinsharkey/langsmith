# Tekton Chains configuration (CTL-02), applied as a patch over the release's chains-config ConfigMap
# (kustomization.yaml). Keys as in https://github.com/tektoncd/chains/blob/v0.30.0/docs/config.md. Chains signs
# TaskRun and PipelineRun results and images with the platform cosign key in Secret signing-secrets
# (signing-secrets.yaml) and records provenance. The transparency log is off: the enclave has no Rekor;
# verification uses the public key (AD-47, ADR 0066).
apiVersion: v1
kind: ConfigMap
metadata:
  name: chains-config
  namespace: tekton-chains
data:
  artifacts.taskrun.format: in-toto
  artifacts.taskrun.storage: oci
  artifacts.oci.storage: oci
  artifacts.pipelinerun.format: in-toto
  artifacts.pipelinerun.storage: oci
  transparency.enabled: "false"
  signers.x509.fulcio.enabled: "false"
