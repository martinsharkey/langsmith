# Tekton Pipelines and Tekton Chains (Apache-2.0), installed by Argo CD (platform/apps/tekton.yaml) from their
# release manifests, vendored unchanged under vendor/ (issue 50). scripts/check_versions.py checks each vendored
# file's SHA-256 against versions.yaml, so a vendored file is always the pinned upstream release:
#   vendor/tekton-pipelines.yaml  https://github.com/tektoncd/pipeline/releases/download/v1.18.0/release.yaml
#   vendor/tekton-chains.yaml     https://github.com/tektoncd/chains/releases/download/v0.30.0/release.yaml
# Configuration is applied here as patches, not by editing the vendored files (AD-40).
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vendor/tekton-pipelines.yaml
  - vendor/tekton-chains.yaml
  - signing-secrets.yaml
patches:
  - path: chains-config.yaml
  # Namespace tekton-pipelines and its Pod Security level belong to platform/manifests/base/namespaces.yaml.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: tekton-pipelines
  # Chains ships an empty Secret for the signing key; signing-secrets.yaml creates it from OpenBao instead.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: signing-secrets
        namespace: tekton-chains
  # Pod Security levels for the two namespaces the releases create. The resolvers keep upstream's restricted
  # level. The Chains controller sets no seccomp profile or dropped capabilities, so it meets baseline only.
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: tekton-pipelines-resolvers
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/audit: restricted
          innovox.uk/platform: sap
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: tekton-chains
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/audit: restricted
          innovox.uk/platform: sap
