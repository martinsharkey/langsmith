# The platform signing key for Tekton Chains, from OpenBao (ADR 0066). Chains reads cosign.key (an encrypted cosign
# private key) and cosign.password from Secret signing-secrets in namespace tekton-chains
# (https://github.com/tektoncd/chains/blob/v0.30.0/docs/signing.md#cosign). The values are written into OpenBao at
# install time (runbook); none are in this repository.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signing-secrets
  namespace: tekton-chains
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: signing-secrets
    creationPolicy: Owner
  data:
  - secretKey: cosign.key
    remoteRef:
      key: tekton-chains/signing
      property: cosign_key
  - secretKey: cosign.password
    remoteRef:
      key: tekton-chains/signing
      property: cosign_password
