---
# Mode B1. The only differences between modes are in this folder (AD-44).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps
  - mode-policies.yaml
patches:
  - target:
      kind: Application
      name: langsmith
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/platform/values/langsmith/values-b1.yaml
