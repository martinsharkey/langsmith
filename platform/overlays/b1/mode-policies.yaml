---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mode-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://git.invalid/platform.git    # set by platform/overlays/release
    targetRevision: platform-release
    path: policies/egress/b1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
