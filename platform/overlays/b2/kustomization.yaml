---
# Mode B2. The only differences between modes are in this folder (AD-44).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps
  - mode-policies.yaml
components:
  # Repository and release tag for every Application (one place, #53).
  - ../release
  # Generated: every Helm source as an OCI chart in the enclave registry (scripts/gen_airgap.py).
  - oci-charts
patches:
  - target:
      kind: Application
      name: langsmith
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/platform/values/langsmith/values-b2.yaml
