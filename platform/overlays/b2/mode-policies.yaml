---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mode-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/martinsharkey/langsmith.git
    targetRevision: main
    path: policies/egress/b2
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
