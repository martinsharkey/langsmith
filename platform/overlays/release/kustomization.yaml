# The one place that says which repository and which release every installation syncs from (issue #53).
# Application files under platform/ carry the placeholders https://git.invalid/platform.git and platform-release;
# both overlays and both root bootstraps (platform/argocd/b1, b2) include this component, which replaces them.
#
# Promotion (owner ruling, #63): installations follow platform release tags `platform-vX.Y.Z`, never a branch.
# To release: set targetRevision below to the new tag, merge through gate PR, then tag that merge commit with
# the same name. An environment moves to the release when its root Application is re-applied at that tag.
# A site that mirrors this repository changes repoURL here, in its mirror, and nowhere else. In B2, Zarf
# rewrites the URL to the enclave git server at admission.
#
# A new Application that is not shaped like these targets fails the kustomize build, so it cannot be missed.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  - sourceValue: https://github.com/martinsharkey/langsmith.git
    targets:
      # Plain-manifest Applications whose single source is a path in this repository.
      - select:
          kind: Application
          name: ^(root|models|mode-policies|platform-.*)$
        fieldPaths:
          - spec.source.repoURL
      # Helm Applications: the `values` source is this repository.
      - select:
          kind: Application
        reject:
          - name: ^(root|models|mode-policies|platform-.*|istio-base|keycloak-operator|local-path-provisioner|trust-manager)$
        fieldPaths:
          - spec.sources.[ref=^values$].repoURL
      - select:
          kind: AppProject
          labelSelector: innovox.uk/release-source=true
        fieldPaths:
          - spec.sourceRepos.0
  - sourceValue: platform-v0.2.0
    targets:
      - select:
          kind: Application
          name: ^(root|models|mode-policies|platform-.*)$
        fieldPaths:
          - spec.source.targetRevision
      - select:
          kind: Application
        reject:
          - name: ^(root|models|mode-policies|platform-.*|istio-base|keycloak-operator|local-path-provisioner|trust-manager)$
        fieldPaths:
          - spec.sources.[ref=^values$].targetRevision
