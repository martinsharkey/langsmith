# Argo CD (Apache-2.0). Installed before Argo CD exists: by helm in B1 (docs/runbooks/install-b1.md) and by Zarf
# in B2 (airgap/zarf). Sign-in is OIDC straight to Keycloak, so the bundled Dex is not deployed.
# Replace `site.example` hostnames for the site, as in the rest of the platform.
global:
  domain: argocd.site.example
dex:
  enabled: false
configs:
  cm:
    url: https://argocd.site.example
    # No local admin. Before Keycloak is up, and as break-glass, operators use kubectl from the jump host
    # (`argocd --core`), which needs cluster credentials rather than an Argo CD password.
    admin.enabled: false
    # Keycloak realm `langsmith`, public client `argocd` with PKCE (Argo CD's documented Keycloak option that also
    # supports `argocd login --sso`). No client secret to hold. Keycloak's certificate is from the platform CA,
    # read from the trust-manager bundle Secret in this namespace (`$<secret>:<key>`; the Secret must carry the
    # label app.kubernetes.io/part-of: argocd).
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.site.example/realms/langsmith
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes: ["openid", "profile", "email", "groups"]
      refreshTokenThreshold: 2m
      rootCA: $platform-ca-bundle:ca-bundle.crt
    # App of apps: restore Application health so the root app waits for each sync wave's Applications to be
    # Healthy before it starts the next wave (Argo CD operator manual, Resource Health, "Argocd App").
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
  rbac:
    # Keycloak groups (groups claim, full path off). Anyone else who signs in gets no access.
    policy.default: ""
    policy.csv: |
      g, platform-admins, role:admin
      g, platform-readonly, role:readonly
    scopes: "[groups]"
