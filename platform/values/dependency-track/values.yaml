# Dependency-Track 5 needs PostgreSQL. It has its own small CloudNativePG cluster (platform/manifests/supply-chain),
# which creates the database and the Secret `dtrack-pg-app` used here. The key that encrypts stored secrets comes
# from OpenBao.
database:
  jdbcUrl: "jdbc:postgresql://dtrack-pg-rw.supply-chain.svc:5432/dtrack?reWriteBatchedInserts=true&sslmode=require"
  existingSecret:
    name: dtrack-pg-app
    usernameKey: username
    passwordKey: password
secretManagement:
  provider: database
  database:
    kek:
      mode: config
      existingSecret:
        name: dependency-track-kek
        key: kek
fileStorage:
  provider: local
  local:
    storageClassName: ceph-block
    size: 20Gi
