# LangSmith 0.17.51, configured only through documented chart values (AD-40).
# Every secret is read from Kubernetes Secrets that External Secrets creates from OpenBao
# (platform/manifests/secrets). Nothing secret is set here.
# Images: pulled by their upstream names; RKE2's registries.yaml mirrors docker.io to the site Harbor.

config:
  # LangSmith's own service traces go to the platform's OpenTelemetry Collector (in-cluster; the mesh carries it).
  observability:
    tracing:
      enabled: true
      endpoint: http://otel-collector.observability.svc:4318
      useTls: false
      exporter: http
  existingSecretName: langsmith-config   # langsmith_license_key, api_key_salt, jwt_secret, oauth_client_secret,
                                          # blob_storage_access_key, blob_storage_access_key_secret,
                                          # insights_encryption_key, polly_encryption_key
  authType: mixed
  hostname: langsmith.site.example
  userOrgCreationDisabled: true
  personalOrgsDisabled: true
  infoEndpointAuthRequired: true
  oauth:
    enabled: true
    oauthClientId: langsmith
    oauthIssuerUrl: https://keycloak.site.example/realms/langsmith
  telemetry:                              # operational telemetry to LangChain off; licence billing beacon is
    logs: false                           # separate and governed by the licence type (see values-b2.yaml)
    metrics: false
    traces: false
  blobStorage:
    enabled: true
    engine: S3
    bucketName: langsmith-blobs
    apiURL: http://rook-ceph-rgw-platform.rook-ceph.svc
    s3UsePathStyle: true
  deployment:
    enabled: true                          # Agent Server deployments through the LangSmith operator
  customCa:                                # CloudNativePG cluster CA plus the site CA bundle
    secretName: platform-ca-bundle
    secretKey: ca-bundle.crt

# ClickHouse is not used: SmithDB replaces it (DP-AI-001 v1.4; LangSmith ends ClickHouse support in v0.19).
# A SmithDB-only install is to be confirmed with LangChain (I-11, I-12).
clickhouse:
  enabled: false

smithdb:
  enabled: true
  resourceTier: small
  cache:
    storageClassName: local-nvme
  langsmith:
    ingestion:
      enabled: true
    query:
      enabled: true
  config:
    existingSecretName: smithdb-config
    metastore:
      hostSecretKey: host
      databaseSecretKey: dbname
      usernameSecretKey: user
      passwordSecretKey: password
      port: "5432"
      useSsl: true
    objectStore:
      type: s3
      bucket: smithdb
      s3:
        endpoint: http://rook-ceph-rgw-platform.rook-ceph.svc
        accessKeyIdSecretKey: AWS_ACCESS_KEY_ID
        secretAccessKeySecretKey: AWS_SECRET_ACCESS_KEY

postgres:
  external:
    enabled: true
    existingSecretName: langsmith-postgres    # key connection_url, from CloudNativePG's app secret
    customTls: true

redis:
  external:
    enabled: true
    existingSecretName: langsmith-valkey      # key connection_url (Valkey, I-15)

istioGateway:
  enabled: true
  name: platform-gateway
  namespace: istio-ingress

# LangSmith LLM Gateway (beta, chart 0.17.1+): the only route from agents to models (AD-59). Enabled for every
# organisation in the installation. Presidio PII detection is optional and off until the data policy needs it.
agentGateway:
  enabled: true
presidioAnalyzer:
  enabled: false

# Sandboxes are off in the first build (AD-56): they need privileged pods, /dev/kvm and JuiceFS.

# Insights and Chat each bundle their own in-cluster PostgreSQL and Redis. The chart's default redis:7 image is
# source-available (RSALv2/SSPL), which AD-52 refuses, so the bundled store uses Valkey, which LangChain lists as a
# supported drop-in for Redis. Found by the rendered-chart policy check; to be proven at E1.
images:
  redisImage:
    repository: docker.io/valkey/valkey
    tag: "9.1.3"

operator:
  # The operator starts a Redis and a PostgreSQL (pgvector) pod for each agent deployment from these templates.
  # LangChain documents overriding them to change the images (self-host-mirroring-images). They are the chart's
  # own templates at 0.17.51 with two changes: Redis 7 (source-available from 7.4, refused by AD-52) becomes
  # Valkey, and the pgvector image is given its registry so the admission allowlist and the enclave mirror can
  # name it. Re-copy from the chart on every LangSmith upgrade. To be proven at E1 (issues 11 and 14).
  templates:
    redis: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${service_name}
        namespace: ${namespace}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: ${service_name}
        template:
          metadata:
            labels:
              app: ${service_name}
          spec:
            enableServiceLinks: false
            containers:
            - name: redis
              image: docker.io/valkey/valkey:9.1.3
              ports:
              - containerPort: 6379
                name: redis
              livenessProbe:
                exec:
                  command:
                  - valkey-cli
                  - ping
                initialDelaySeconds: 30
                periodSeconds: 10
              readinessProbe:
                tcpSocket:
                  port: 6379
                initialDelaySeconds: 10
                periodSeconds: 5
    db: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: ${service_name}
      spec:
        serviceName: ${service_name}
        selector:
          matchLabels:
            app: ${service_name}
        persistentVolumeClaimRetentionPolicy:
          whenDeleted: Delete
          whenScaled: Retain
        template:
          metadata:
            labels:
              app: ${service_name}
          spec:
            containers:
            - name: postgres
              image: docker.io/pgvector/pgvector:pg15
              ports:
              - containerPort: 5432
              command: ["docker-entrypoint.sh"]
              args:
                - postgres
                - -c
                - max_connections=${max_connections}
              env:
              - name: PGDATA
                value: /var/lib/postgresql/data/pgdata
              volumeMounts:
              - name: postgres-data
                mountPath: /var/lib/postgresql/data
            enableServiceLinks: false
        volumeClaimTemplates:
        - metadata:
            name: postgres-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: "${storage_gi}Gi"
