# OpenBao (MPL-2.0) holds every platform secret (CTL-11). Unseal keys are split between named custodians at
# initialisation and never stored in Kubernetes or this repository.
# The openbao namespace is not in the mesh, so OpenBao serves TLS itself (chart 0.30.7 defaults to tls_disable).
# Its certificate comes from the platform CA; External Secrets trusts that CA (platform/manifests/secrets).
global:
  tlsDisable: false              # chart: BAO_ADDR, BAO_API_ADDR and probes use https
injector:
  enabled: false
server:
  statefulSet:
    securityContext:
      container:                 # meets the 'restricted' Pod Security level of the openbao namespace
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  extraVolumes:
    - type: secret               # mounted at /openbao/userconfig/openbao-tls
      name: openbao-tls
  extraEnvironmentVars:
    BAO_CACERT: /openbao/userconfig/openbao-tls/ca.crt   # the bao CLI in the pod trusts the platform CA
  ha:
    enabled: true
    replicas: 3
    # Each node advertises its stable pod name (in the certificate), not its pod IP (which is not).
    apiAddr: https://$(BAO_K8S_POD_NAME).openbao-internal:8200
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/openbao/userconfig/openbao-tls/tls.crt"
          tls_key_file = "/openbao/userconfig/openbao-tls/tls.key"
          tls_auto_reload = true
          tls_min_version = "tls12"
        }

        storage "raft" {
          path = "/openbao/data"
          retry_join {
            leader_api_addr = "https://openbao-0.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }
          retry_join {
            leader_api_addr = "https://openbao-1.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }
          retry_join {
            leader_api_addr = "https://openbao-2.openbao-internal:8200"
            leader_ca_cert_file = "/openbao/userconfig/openbao-tls/ca.crt"
          }
        }

        service_registration "kubernetes" {}
  dataStorage:
    storageClass: ceph-block
  auditStorage:
    enabled: true
    storageClass: ceph-block
ui:
  enabled: true
extraObjects:
  # Serving certificate for the API (8200). Names: the services clients use, and each pod for Raft joins.
  # 127.0.0.1 is BAO_ADDR inside the pod and the address of a `kubectl port-forward` from the jump host.
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: openbao-tls
      namespace: openbao
    spec:
      secretName: openbao-tls
      dnsNames:
        - openbao.openbao.svc
        - openbao.openbao.svc.cluster.local
        - openbao-active.openbao.svc
        - openbao-active.openbao.svc.cluster.local
        - openbao-internal
        - "*.openbao-internal"
        - "*.openbao-internal.openbao.svc"
        - "*.openbao-internal.openbao.svc.cluster.local"
      ipAddresses:
        - 127.0.0.1
      privateKey:
        algorithm: ECDSA
        size: 256
        rotationPolicy: Always
      issuerRef:
        name: platform-ca-issuer
        kind: ClusterIssuer
