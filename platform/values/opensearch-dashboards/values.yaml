replicaCount: 2
image:
  repository: docker.io/opensearchproject/opensearch-dashboards   # fully qualified for the admission allowlist
# Signs in as kibanaserver, with the password External Secrets writes (platform/values/opensearch/values.yaml), and
# verifies OpenSearch's certificate against the platform CA (issues 47 and 57). The image entrypoint turns
# OPENSEARCH_SSL_* variables into --opensearch.ssl.* options (opensearch-build, opensearch-dashboards-docker-entrypoint-3.x.sh).
opensearchAccount:
  secret: opensearch-dashboards-user
secretMounts:
  - name: platform-ca
    secretName: platform-ca-bundle      # trust-manager writes it to every namespace
    path: /usr/share/opensearch-dashboards/config/platform-ca
extraEnvs:
  - name: OPENSEARCH_SSL_CERTIFICATEAUTHORITIES
    value: /usr/share/opensearch-dashboards/config/platform-ca/ca-bundle.crt
  - name: OPENSEARCH_SSL_VERIFICATIONMODE
    value: full
