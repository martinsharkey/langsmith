# Central log and audit store (CTL-13). The admin password comes from OpenBao through External Secrets.
replicas: 3
global:
  dockerRegistry: docker.io      # fully qualified image names, so the admission allowlist can match them
persistence:
  enableInitChown: false          # no busybox:latest init container; volume ownership comes from fsGroup
  storageClass: ceph-block
  size: 200Gi
extraEnvs:
  - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: opensearch-admin
        key: password
