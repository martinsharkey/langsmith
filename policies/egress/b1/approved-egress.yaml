# Mode B1 (connected, OFFICIAL-SENSITIVE). LangSmith reaches two external destinations only (AD-45):
# - LangChain's beacon, which an online licence requires ("Egress to https://beacon.langchain.com is required",
#   docs.langchain.com/langsmith/self-host-egress, read 2026-11-21). The page does not say which services call it,
#   so the rule allows the workloads the chart gives the licence key, and no others: Agent Server deployments,
#   the operator, the frontend and the per-deployment databases are denied (deny-world-egress.yaml).
#   tests/config/check_platform.py --rendered fails if this list and the rendered chart disagree.
# - The UK model endpoints the customer has approved, reachable only from the LLM Gateway pods.
# Add each approved endpoint to BOTH the gateway rule below and the Istio ServiceEntry (the mesh refuses
# unregistered hosts).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langsmith-licence-beacon
  namespace: langsmith
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - langsmith-agent-gateway
          - langsmith-backend
          - langsmith-backend-auth-bootstrap
          - langsmith-backend-backfill-check
          - langsmith-backend-migrations
          - langsmith-e2e-test
          - langsmith-host-backend
          - langsmith-ingest-queue
          - langsmith-listener
          - langsmith-platform-backend
          - langsmith-queue
          - langsmith-smithdb-cluster-manager
          - langsmith-smithdb-compaction
          - langsmith-smithdb-compaction-worker
          - langsmith-smithdb-ingestion
          - langsmith-smithdb-metastore-migration
          - langsmith-smithdb-query
          - langsmith-standalone-insights-api-server
          - langsmith-standalone-insights-queue
          - langsmith-standalone-polly-api-server
          - langsmith-standalone-polly-queue
  egress:
    - toFQDNs:
        - matchName: beacon.langchain.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gateway-approved-model-endpoints
  namespace: langsmith
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: langsmith-agent-gateway
  egress:
    - toFQDNs:
        # One line for each customer-approved, UK-processed model endpoint. None is approved by default.
        # - matchName: models.approved-provider.example
        - matchName: no-endpoint-approved.invalid
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: approved-external
  namespace: langsmith
spec:
  hosts:
    - beacon.langchain.com
    # - models.approved-provider.example
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 443
      name: tls
      protocol: TLS
