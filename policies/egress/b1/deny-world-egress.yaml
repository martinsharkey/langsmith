# Mode B1: no pod reaches the internet unless it is named here (issue 33; owner ruling 2026-11-21, "Argo CD").
# Allowed, each to named hosts only:
# - LangSmith's LLM Gateway (approved model endpoints) and licence holders (beacon): approved-egress.yaml;
# - Argo CD's repo server (git and Helm chart sources): argocd-sources below;
# - CoreDNS, to the site's resolvers on port 53: ../common/coredns-egress.yaml.
# Harbor's proxy cache, Dependency-Track feeds and Falco's rule downloads are denied, as in mode B2.
# Deny rules take precedence over every allow rule (docs.cilium.io/en/v1.20/security/policy/deny/), so the deny
# selects everything except the pods above. tests/config/check_platform.py evaluates these selectors against a
# sample pod in every namespace.
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: b1-deny-world-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [kube-system, langsmith, argocd]
  enableDefaultDeny:         # deny world only; do not switch every pod to default-deny
    egress: false
    ingress: false
  egressDeny:
    - toEntities:
        - world
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: b1-deny-world-egress-kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
    matchExpressions:
      - key: k8s-app
        operator: NotIn
        values: [kube-dns]
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toEntities:
        - world
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: b1-deny-world-egress-langsmith
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: langsmith
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values:             # the gateway and the licence holders in approved-egress.yaml
          - langsmith-agent-gateway
          - langsmith-backend
          - langsmith-backend-auth-bootstrap
          - langsmith-backend-backfill-check
          - langsmith-backend-migrations
          - langsmith-e2e-test
          - langsmith-host-backend
          - langsmith-ingest-queue
          - langsmith-listener
          - langsmith-platform-backend
          - langsmith-queue
          - langsmith-smithdb-cluster-manager
          - langsmith-smithdb-compaction
          - langsmith-smithdb-compaction-worker
          - langsmith-smithdb-ingestion
          - langsmith-smithdb-metastore-migration
          - langsmith-smithdb-query
          - langsmith-standalone-insights-api-server
          - langsmith-standalone-insights-queue
          - langsmith-standalone-polly-api-server
          - langsmith-standalone-polly-queue
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toEntities:
        - world
---
# Argo CD: every pod reaches the cluster and DNS; only the repo server reaches the internet, and only the hosts
# its sources name (platform/apps, and the release repository in platform/overlays/release). Helm repositories
# hosted on GitHub Pages serve chart archives from GitHub release assets (*.githubusercontent.com).
# tests/config/check_platform.py fails if an Application names a host this list does not allow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-cluster
  namespace: argocd
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - cluster
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: argocd-sources
  namespace: argocd
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  egress:
    - toFQDNs:
        - matchName: github.com
        - matchPattern: "*.githubusercontent.com"
        - matchName: charts.external-secrets.io
        - matchName: charts.jetstack.io
        - matchName: charts.rook.io
        - matchName: cloudnative-pg.github.io
        - matchName: dependencytrack.github.io
        - matchName: falcosecurity.github.io
        - matchName: fluent.github.io
        - matchName: helm.goharbor.io
        - matchName: istio-release.storage.googleapis.com
        - matchName: kedacore.github.io
        - matchName: kyverno.github.io
        - matchName: langchain-ai.github.io
        - matchName: open-telemetry.github.io
        - matchName: openbao.github.io
        - matchName: opensearch-project.github.io
        - matchName: prometheus-community.github.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
