# Mode B2 (disconnected enclave). Nothing in the cluster may reach anything outside it (CTL-08), except CoreDNS,
# which forwards to the enclave's resolvers on port 53 (../common/coredns-egress.yaml; issue 33). Deny rules take
# precedence over any allow rule, so no later policy can open a route out by mistake.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-world-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [kube-system]
  enableDefaultDeny:         # deny world only; do not switch every pod to default-deny
    egress: false
    ingress: false
  egressDeny:
    - toEntities:
        - world
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-world-egress-kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
    matchExpressions:
      - key: k8s-app
        operator: NotIn
        values: [kube-dns]
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toEntities:
        - world
