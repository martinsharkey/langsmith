# CoreDNS resolves names outside the cluster by forwarding to the site's resolvers, which are outside the cluster.
# Both modes deny every other pod the internet; CoreDNS keeps the cluster and port 53 only (issue 33).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns-egress
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
    - toEntities:
        - cluster
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
