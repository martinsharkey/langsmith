# CTL-01 / PW.4. Every image is pinned to an explicit tag or digest; `latest` and untagged images are refused.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: Supply chain
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "Images must carry an explicit tag or digest."
        pattern:
          spec:
            containers:
              - image: "*:* | *@sha256:*"
    - name: disallow-latest
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "The 'latest' tag is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
