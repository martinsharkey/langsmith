# CTL-01 / PW.4. Every image is pinned to an explicit tag or digest; `latest` and untagged images are refused.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: Supply chain
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: images
      # Container images, and image volumes (spec.volumes[*].image.reference), which carry model weights.
      expression: >-
        variables.containers.map(c, c.image) +
        object.spec.?volumes.orValue([]).filter(v, has(v.image)).map(v, v.image.reference)
  validations:
    # The tag is whatever follows a colon in the last path segment, so a registry port is not mistaken for one.
    # "auto" is Istio's injection placeholder.
    - expression: >-
        variables.images.all(image, image == "auto" || image.contains("@sha256:") ||
        image.split("/")[size(image.split("/")) - 1].contains(":"))
      message: "Images must carry an explicit tag or digest."
    - expression: >-
        variables.images.all(image, image.contains("@sha256:") || !image.endsWith(":latest"))
      message: "The 'latest' tag is not allowed."
