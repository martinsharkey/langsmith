# Issued model intake decisions (AD-46, issue 35), read at admission by require-model-intake-record.yaml.
# One entry per approval, exactly as `model-intake decide` prints it:
#   <decision ID>: <weights image by digest>
# For example:  INT-YYYYMMDD-xxxxxxxx: <registry>/innovox/models/<name>@sha256:<64 hex>
# Add an entry only through a reviewed pull request with the decision record (decision.json) in the evidence store.
# Remove the entry to withdraw an approval; model pods that name it are then refused.
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-intake-decisions
  namespace: kyverno
data: {}
