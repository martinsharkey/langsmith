# CTL-01. Pods may only use images from approved sources. Nodes pull every upstream name through the site Harbor
# mirror (infra/rke2/config/registries.yaml.example), so this list is the supply-chain allowlist, not a network path.
# Each entry is a prefix: a registry path ending in "/" allows every image under it; one ending in ":" allows
# every tag of that one image.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-sources
  annotations:
    policies.kyverno.io/title: Restrict image sources
    policies.kyverno.io/category: Supply chain
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    # A rendered chart can carry `volumes: null`; the API server drops it, the CLI does not.
    - name: volumes
      expression: object.spec.?volumes.orValue([])
    - name: images
      # Container images, and image volumes (spec.volumes[*].image.reference), which carry model weights.
      expression: >-
        variables.containers.map(c, c.image) + (type(variables.volumes) == null_type ? [] :
        variables.volumes.filter(v, has(v.image)).map(v, v.image.reference))
    - name: allowed
      expression: |-
        [
        "docker.io/langchain/",
        "docker.io/vllm/",
        "docker.io/valkey/",
        "docker.io/amazon/aws-cli:",
        "ghcr.io/cloudnative-pg/",
        "quay.io/ceph/",
        "quay.io/cephcsi/",
        "quay.io/keycloak/",
        "quay.io/jetstack/",
        "quay.io/argoproj/",
        // Argo CD's own cache, as its chart ships it (Redis 8, AGPL-3.0). Used by Argo CD only.
        "ecr-public.aws.com/docker/library/redis:",
        "quay.io/prometheus/",
        "quay.io/prometheus-operator/",
        "quay.io/openbao/",
        "ghcr.io/external-secrets/",
        "ghcr.io/kedacore/",
        "reg.kyverno.io/kyverno/",
        "docker.io/rook/",
        "docker.io/goharbor/",
        "docker.io/istio/",
        "docker.io/opensearchproject/",
        "docker.io/falcosecurity/",
        "cr.fluentbit.io/fluent/",
        "docker.io/grafana/",
        "registry.k8s.io/",
        "docker.io/rancher/",
        "registry.istio.io/release/",
        "ghcr.io/kyverno/",
        "ghcr.io/jkroepke/kube-webhook-certgen:",
        "quay.io/kiwigrid/k8s-sidecar:",
        "docker.io/postgres:",
        "ghcr.io/open-telemetry/opentelemetry-collector-releases/",
        "docker.io/dependencytrack/",
        // Per-deployment store started by the LangGraph operator for each agent deployment.
        "docker.io/pgvector/pgvector:",
        "harbor.site.example/innovox/",
        // Tekton Pipelines and Chains (platform/manifests/tekton), pinned by digest in the vendored releases.
        "ghcr.io/tektoncd/pipeline/",
        "ghcr.io/tektoncd/chains/",
        // The shell image the Tekton controller gives TaskRun steps (-shell-image in the pipelines release).
        "cgr.dev/chainguard/busybox@sha256:19f02276bf8dbdd62f069b922f10c65262cc34b710eea26ff928129a736be791",
        ]
  validations:
    # Istio's gateway chart ships the placeholder image "auto"; the sidecar injector replaces it, and the injected
    # Pod is checked again against this list.
    - expression: >-
        variables.images.all(image, image == "auto" || variables.allowed.exists(prefix, image.startsWith(prefix)))
      message: "Image source is not on the platform allowlist (policies/kyverno/policies/restrict-image-sources.yaml)."
