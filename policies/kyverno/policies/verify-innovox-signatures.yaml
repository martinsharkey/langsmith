# CTL-01 / AD-47. Images built by Innovox pipelines must carry a cosign signature from the platform signing key.
# The public key is held in Secret kyverno/cosign-public-key (key cosign.pub). Offline: no transparency log.
# LangChain images are signed keyless with Sigstore; their attestor is added once LangChain confirms the signing
# identity (issue 15).
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-innovox-signatures
  annotations:
    policies.kyverno.io/title: Verify Innovox image signatures
    policies.kyverno.io/category: Supply chain
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "harbor.site.example/innovox/*"
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: platform
      cosign:
        key:
          kms: k8s://kyverno/cosign-public-key
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.platform])).all(count, count > 0)
      message: "Image is not signed by the platform signing key."
