# CTL-01 / AD-47. Images built by Innovox pipelines must carry a cosign signature from the platform signing key
# (ADR 0066). The public key is held in Secret kyverno/cosign-public-key (key cosign.pub). Offline: no transparency
# log.
#
# Every image a pod runs or mounts is verified (issue 36): containers, init containers and ephemeral containers,
# which Kyverno extracts itself as images.containers, images.initContainers and images.ephemeralContainers, and image
# volumes (spec.volumes[*].image.reference), which carry model weights and which Kyverno does not extract, so they
# are declared below under `images`. Source read: kyverno v1.19.2 pkg/cel/compiler/images.go (built-in extractors)
# and pkg/image/verification/evaluator/policy.go (custom extractors are added to them, and every extracted image is
# filtered by matchImageReferences, checked for a digest and covered by `required`). Tested against real signed and
# unsigned images by gate PR job `signatures` (scripts/verify_signatures.py).
# LangChain images are signed keyless with Sigstore; their attestor is added once LangChain confirms the signing
# identity (issue 15).
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-innovox-signatures
  annotations:
    policies.kyverno.io/title: Verify Innovox image signatures
    policies.kyverno.io/category: Supply chain
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  images:
    - name: imageVolumes
      expression: >-
        (object != null ? object : oldObject).spec.?volumes.orValue([]).filter(v, has(v.image)).map(v, v.image.reference)
  matchImageReferences:
    - glob: "harbor.site.example/innovox/*"
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: platform
      cosign:
        key:
          kms: k8s://kyverno/cosign-public-key
        ctlog:
          insecureIgnoreTlog: true
          insecureIgnoreSCT: true
  validations:
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers + images.imageVolumes).map(image,
        verifyImageSignatures(image, [attestors.platform])).all(count, count > 0)
      message: "Image is not signed by the platform signing key."
