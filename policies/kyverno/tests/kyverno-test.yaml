apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-admission-policies
policies:
  - ../policies/restrict-image-sources.yaml
  - ../policies/disallow-latest-tag.yaml
  - ../policies/require-model-intake-record.yaml
resources:
  - resources.yaml
results:
  - policy: restrict-image-sources
    isValidatingPolicy: true
    resources: [good-langsmith, good-model, good-registry-port]
    kind: Pod
    result: pass
  - policy: restrict-image-sources
    isValidatingPolicy: true
    resources: [bad-unknown-source, bad-lookalike-source]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    resources: [good-langsmith, good-registry-port]
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    isValidatingPolicy: true
    resources: [bad-untagged, bad-latest, bad-untagged-registry-port]
    kind: Pod
    result: fail
  - policy: require-model-intake-record
    isValidatingPolicy: true
    resources: [good-model]
    kind: Pod
    result: pass
  - policy: require-model-intake-record
    isValidatingPolicy: true
    resources: [bad-model-no-record, bad-model-missing-annotation]
    kind: Pod
    result: fail
