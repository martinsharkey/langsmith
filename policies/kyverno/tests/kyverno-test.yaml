apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: platform-admission-policies
policies:
  - ../policies/restrict-image-sources.yaml
  - ../policies/disallow-latest-tag.yaml
  - ../policies/require-model-intake-record.yaml
resources:
  - resources.yaml
results:
  - policy: restrict-image-sources
    rule: approved-sources
    resources: [good-langsmith, good-model]
    kind: Pod
    result: pass
  - policy: restrict-image-sources
    rule: approved-sources
    resources: [bad-unknown-source]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources: [good-langsmith]
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources: [bad-untagged]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: disallow-latest
    resources: [bad-latest]
    kind: Pod
    result: fail
  - policy: require-model-intake-record
    rule: intake-record-present
    resources: [good-model]
    kind: Pod
    result: pass
  - policy: require-model-intake-record
    rule: intake-record-present
    resources: [bad-model-no-record]
    kind: Pod
    result: fail
