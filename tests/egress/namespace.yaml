# Created and deleted by tests/run-e2-checks.sh for the zero-egress probe (issue 34). It must carry no egress
# policy of its own and no mesh injection, so only the cluster-wide policies apply to the probe.
apiVersion: v1
kind: Namespace
metadata:
  name: egress-probe
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    innovox.uk/test: zero-egress
