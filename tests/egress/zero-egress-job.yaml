# Gate E2 / CTL-08. Proves the enclave (B2) has no route out. tests/run-e2-checks.sh runs this Job in namespaces
# that have no egress policy of their own (issue 34): egress-probe, which the script creates and deletes, and
# observability, a privileged platform namespace. Only the cluster-wide deny-world-egress policy can then block it.
# The Job succeeds only when the in-cluster positive control (the API server) connects, so a probe that cannot open
# sockets at all is not mistaken for zero egress, and every outside target is refused or times out. Negative control at E1: with deny-world-egress removed, it must fail.
apiVersion: batch/v1
kind: Job
metadata:
  name: zero-egress-test
  labels:
    innovox.uk/test: zero-egress
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"   # test the network policy itself, not only the mesh
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: docker.io/valkey/valkey:9.1.3   # already in the enclave registry; only its shell tools are used
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              fail=0
              for target in kubernetes.default.svc.cluster.local:443; do
                host=${target%:*}; port=${target#*:}
                if timeout 5 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
                  echo "ok   reached in-cluster $target"
                else
                  echo "FAIL in-cluster $target unreachable: the probe cannot tell blocked from broken"; fail=1
                fi
              done
              for target in 1.1.1.1:443 8.8.8.8:53 9.9.9.9:443 beacon.langchain.com:443 github.com:443; do
                host=${target%:*}; port=${target#*:}
                if timeout 5 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
                  echo "FAIL egress reached $target"; fail=1
                else
                  echo "ok   blocked $target"
                fi
              done
              exit $fail
