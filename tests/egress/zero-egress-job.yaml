# Gate E2 / CTL-08. Proves the enclave (B2) has no route out: every attempt must FAIL. Run from inside a platform
# namespace so the same policies apply. The job succeeds only when all connections are refused or time out.
apiVersion: batch/v1
kind: Job
metadata:
  name: zero-egress-test
  namespace: langsmith
  labels:
    innovox.uk/test: zero-egress
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"   # test the network policy itself, not only the mesh
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: docker.io/valkey/valkey:9.1.3   # already in the enclave registry; only its shell tools are used
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/bash", "-c"]
          args:
            - |
              fail=0
              for target in 1.1.1.1:443 8.8.8.8:53 9.9.9.9:443 beacon.langchain.com:443 github.com:443; do
                host=${target%:*}; port=${target#*:}
                if timeout 5 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
                  echo "FAIL egress reached $target"; fail=1
                else
                  echo "ok   blocked $target"
                fi
              done
              exit $fail
