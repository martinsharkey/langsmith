# Single source of pinned versions. Checked against upstream tags on 2026-11-11.
# scripts/check_versions.py (gate PR, job lint) fails when a pin elsewhere disagrees with this file: Argo CD
# Applications, images in platform/manifests, vendored releases (by SHA-256), CI tool versions and hashed CI
# requirement files. Keys are unique across groups.
# Renovate (renovate.json) proposes upgrades as pull requests; every upgrade passes gates PR, E1 and E2.
kubernetes:
  rke2: v1.37.2+rke2r1
  kubernetes-api: 1.37.2           # the Kubernetes version of rke2; schema checks and helm template use it
gitops:
  argo-cd-chart: 10.18.0            # https://argoproj.github.io/argo-helm
platform:
  cert-manager-chart: v1.21.3       # https://charts.jetstack.io
  trust-manager-chart: v0.26.0      # https://charts.jetstack.io
  local-path-provisioner: v0.0.37   # github.com/rancher/local-path-provisioner (git tag, chart in the repo)
  external-secrets-chart: 2.15.0    # https://charts.external-secrets.io
  openbao-chart: 0.30.7             # https://openbao.github.io/openbao-helm  (OpenBao v2.7.2)
  rook-ceph-chart: v1.21.2          # https://charts.rook.io/release
  ceph-image: quay.io/ceph/ceph:v20.2.5
  aws-cli-image: docker.io/amazon/aws-cli:2.40.1   # bucket creation job (platform/manifests/rook)
  cloudnative-pg-chart: 0.29.1      # https://cloudnative-pg.github.io/charts
  postgresql-image: ghcr.io/cloudnative-pg/postgresql:18.7-202611201711-standard-trixie@sha256:5827829071060876c4029650c04183e4ee562da3ebb9e88c914d67c8dc8669d6  # CloudNativePG catalog-standard-trixie
  valkey-image: docker.io/valkey/valkey:9.1.3
  harbor-chart: 1.19.4              # https://helm.goharbor.io
  keycloak-operator: 26.8.2         # github.com/keycloak/keycloak-k8s-resources
  otel-collector-chart: 0.180.0    # https://open-telemetry.github.io/opentelemetry-helm-charts  (app 0.163.2)
  keda-chart: 2.21.0               # https://kedacore.github.io/charts  (KEDA v2.21.0)
  kyverno-chart: 3.9.2              # https://kyverno.github.io/kyverno  (Kyverno v1.19.2)
  istio-charts: 1.30.8              # https://istio-release.storage.googleapis.com/charts
  opensearch-chart: 3.9.0           # https://opensearch-project.github.io/helm-charts
  kube-prometheus-stack-chart: 93.2.2  # https://prometheus-community.github.io/helm-charts
  falco-chart: 9.2.2                # https://falcosecurity.github.io/charts
  fluent-bit-chart: 0.58.3          # https://fluent.github.io/helm-charts
  opensearch-dashboards-chart: 3.9.0
models:
  vllm-image: docker.io/vllm/vllm-openai:v0.33.0
langsmith:
  langsmith-chart: 0.17.51          # https://langchain-ai.github.io/helm  (app 0.17.74)
supply-chain:
  zarf: v0.89.0
  cosign: v3.1.4
  trivy: v0.76.2
  tekton-pipelines: v1.18.0
  # SHA-256 of release.yaml as published, vendored in platform/manifests/tekton/vendor/
  tekton-pipelines-sha256: 029c8400e42d0fcd4fc669140d382af1f1d8ae86202b710d6197ae22bd48be5f
  tekton-chains: v0.30.0
  tekton-chains-sha256: c42ae4c77db8fdc4f41339c88ffb59ce918559942b185b80628ceb7b8a7ebdf6
